[package]
name = "gctl-ghost"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

[dependencies]
hex = "0.4"
jsonwebtoken = "9.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "stream"] }
url = "2.5.0"
thiserror = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["fs"] }
serde_with = "3.11.0"

[dev-dependencies]
insta = "1.41.1"
dotenvy = "0.15"
wiremock = "0.5"
tokio = { version = "1.0", features = ["full", "test-util"] }
env_logger = "0.10"
log = "0.4"
