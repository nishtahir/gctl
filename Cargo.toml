[workspace]
resolver = "2"

members = [
    "gctl-bin",
    "gctl-ghost",
    "gctl-liquid"
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde_with = "3.11.0"
thiserror = "1.0"
bon = "3.7.1"