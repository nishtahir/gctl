[package]
name = "gctl-ghost"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

[dependencies]
hex = "0.4.3"
jsonwebtoken = "9.3.0"
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10.1", features = ["json"] }
url = "2.5.3"
thiserror = "1.0"

[dev-dependencies]
insta = "1.41.1"
dotenvy = "0.15"
wiremock = "0.5"
tokio = { version = "1.0", features = ["full"] }
