[workspace]
resolver = "2"

members = [
    "gctl-bin",
    "gctl-ghost",
    "gctl-markdown"
]
default-members = ["gctl-bin"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde_with = "3.11.0"
thiserror = "1.0"
bon = "3.7.1"
dotenvy = "0.15.7"
insta = { version = "1.26.0", features = ["json"] }
