[package]
name = "gctl-ghost"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

[dependencies]
hex = "0.4"
jsonwebtoken = "9.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9.1", features = ["json"] }
url = "2.5.0"
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
insta = "1.41.1"
dotenvy = "0.15"
wiremock = "0.5"
tokio = { version = "1.0", features = ["full"] }
